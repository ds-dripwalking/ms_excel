version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kombain
      POSTGRES_USER: kombain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kombain}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kombain"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kombain-network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kombain-network

  api:
    build: ./backend
    env_file: ./backend/.env.example
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - temp_files:/tmp/kombain
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kombain-network

  worker:
    build: ./backend
    env_file: ./backend/.env.example
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - temp_files:/tmp/kombain
    networks:
      - kombain-network

  beat:
    build: ./backend
    env_file: ./backend/.env.example
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=info
    networks:
      - kombain-network

  frontend:
    build: ./frontend
    depends_on:
      - api
    networks:
      - kombain-network

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - api
    networks:
      - kombain-network

volumes:
  postgres_data:
  redis_data:
  temp_files:

networks:
  kombain-network:
    driver: bridge
